name: Scheduled Scraper Pipeline

on:
  schedule:
    - cron: '0 0 * * 4' # Run every Thursday at 00:00 UTC
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: write # Allow workflow to commit and push changes back

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraper
        run: python scripts/scrape_odds.py

      - name: Validate Data
        run: python scripts/validate_data.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/probabilities.json
          # Check if there are changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes in probabilities.json"
          else
            git commit -m "chore: auto-update probability data"
            git push
          fi
